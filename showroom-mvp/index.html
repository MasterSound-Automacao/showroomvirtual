<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterSound Virtual Showroom MVP</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #111; }
        
        /* UI Overlay - Keypad Simulator */
        #ui-layer {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .lutron-keypad {
            background: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
            width: 120px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .lutron-header {
            font-size: 10px;
            text-align: center;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .keypad-btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            margin-bottom: 4px;
            background: #fff;
            border: 1px solid #ddd;
            cursor: pointer;
            font-size: 11px;
            text-align: center;
            transition: all 0.2s ease;
            position: relative;
        }

        .keypad-btn:hover { background: #f9f9f9; }
        
        /* Status LED simulation */
        .keypad-btn::after {
            content: '';
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 4px;
            background: #ccc;
            border-radius: 50%;
            transition: background 0.3s;
        }

        .keypad-btn.active {
            background-color: #e6e6e6;
            font-weight: bold;
        }

        .keypad-btn.active::after {
            background: #00ff00; /* Lutron Green LED */
            box-shadow: 0 0 4px #00ff00;
        }

        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 50;
            cursor: pointer;
        }

        #instructions h1 { font-size: 36px; margin: 0; }
        #instructions p { font-size: 18px; }
    </style>
    <!-- Import Map for Three.js without build step -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">Carregando Engine...</div>
    
    <div id="instructions">
        <h1>Clique para Entrar</h1>
        <p>Use W, A, S, D para andar</p>
        <p>Use <b>E</b> para Sentar/Levantar</p>
        <p>Mouse para olhar</p>
        <p>ESC para sair</p>
    </div>

    <!-- Hidden Video Element for Texture -->
    <video id="video-source" loop crossOrigin="anonymous" playsinline style="display:none">
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" type="video/mp4">
    </video>

    <!-- Hidden Audio Element for Music Test Mode -->
    <audio id="music-source" loop crossOrigin="anonymous" style="display:none">
        <source src="https://raw.githubusercontent.com/mrdoob/three.js/master/examples/sounds/376737_Skullbeatz___Bad_Cat_Maste.mp3" type="audio/mpeg">
    </audio>

    <div id="ui-layer">
        <div class="lutron-keypad">
            <div class="lutron-header">Control</div>
            <!-- Cinema Mode Removed as requested -->
            <button class="keypad-btn" id="btn-test" onclick="triggerScene('Test')">TEST</button>
            <button class="keypad-btn" id="btn-off" onclick="triggerScene('Off')">OFF</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

        // --- Configuration Constants ---
        const ROOM_SIZE = { w: 10, h: 4, d: 8 };
        const SPEAKER_POSITIONS = [
            // Front L/C/R moved to top and tilted dynamically via lookAt
            { x: -3, y: 3.2, z: -3.5, label: "Front Left" },
            { x: 3, y: 3.2, z: -3.5, label: "Front Right" },
            { x: 0, y: 3.2, z: -3.5, label: "Center" },
            { x: -4, y: 1.5, z: 3, label: "Surround Left" },
            { x: 4, y: 1.5, z: 3, label: "Surround Right" },
            { x: 0, y: 0.6, z: 3.5, label: "Subwoofer Rear" } // Single Subwoofer at the back
        ];

        // --- Global State ---
        let scene, camera, renderer, controls;
        let audioContext;
        let masterGain;
        let convolverNode; // Reverb
        let lights = {};
        let materials = {};
        let soundSources = []; // Array to hold oscillator/panner references
        let manualGains = []; // Array for manual distance attenuation
        let speakerMeshes = []; // Store references to speaker 3D objects
        let isAudioInitialized = false;
        let testModeTimer = null; // Reference to cancel test loop
        
        // Light Probe for Dynamic Screen Lighting
        let lightProbeCanvas, lightProbeCtx;

        // Movement State
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let isSitting = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        // --- Initialization ---
        function init() {
            // 0. Safety Check for File Protocol (CORS Issues)
            if (window.location.protocol === 'file:') {
                const instructions = document.getElementById('instructions');
                instructions.style.display = 'flex';
                instructions.innerHTML = `
                    <h1 style="color: #ff5555; text-shadow: 0 0 10px #000;">ERRO CRÍTICO</h1>
                    <div style="background: rgba(0,0,0,0.8); padding: 20px; border: 1px solid #ff5555; max-width: 600px; text-align: center;">
                        <p style="font-size: 18px; margin-bottom: 20px;">
                            Você abriu o arquivo diretamente (file://).<br>
                            O navegador bloqueia o carregamento de texturas e sons por segurança.
                        </p>
                        <p style="font-size: 16px; color: #aaa;">
                            <b>COMO CORRIGIR:</b><br><br>
                            1. Abra o terminal na pasta do projeto.<br>
                            2. Digite: <code style="background:#333; padding:4px; color:white;">python -m http.server</code><br>
                            3. Acesse no navegador: <a href="http://localhost:8000" style="color: #00ff00;">http://localhost:8000</a>
                        </p>
                    </div>
                `;
                // Stop initialization to prevent console flood
                return;
            }

            // Init Dynamic Lighting Probe
            lightProbeCanvas = document.createElement('canvas');
            lightProbeCanvas.width = 4;
            lightProbeCanvas.height = 4;
            lightProbeCtx = lightProbeCanvas.getContext('2d', { willReadFrequently: true });
            lightProbeCtx.imageSmoothingEnabled = false; // Fast sampling

            // 1. Setup Three.js Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x101010);
            scene.fog = new THREE.FogExp2(0x101010, 0.05);

            // Initialize RectAreaLight (Essential for Screen Glow)
            RectAreaLightUniformsLib.init();

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 5); // Human height, back of room

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Controls Setup
            controls = new PointerLockControls(camera, document.body);
            
            // Handle Pointer Lock Errors (Common in VS Code Simple Browser)
            document.addEventListener('pointerlockerror', function() {
                const instructions = document.getElementById('instructions');
                instructions.style.display = 'flex';
                instructions.innerHTML = `
                    <h1>Erro de Navegador</h1>
                    <p style="color: #ff5555; text-align: center; max-width: 600px;">
                        O bloqueio de mouse foi impedido. Isso acontece frequentemente dentro do editor.<br>
                        <b>Abra o link no seu navegador (Chrome/Edge) para testar.</b><br>
                        (http://localhost:8000)
                    </p>
                `;
            });

            const instructions = document.getElementById('instructions');
            instructions.addEventListener('click', function () {
                controls.lock();
                // Ensure audio/video starts on user interaction
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                const video = document.getElementById('video-source');
                if (video.paused) {
                    video.play().catch(e => console.log("Video play handled by interaction"));
                }
            });

            controls.addEventListener('lock', function () {
                instructions.style.display = 'none';
            });

            controls.addEventListener('unlock', function () {
                instructions.style.display = 'flex';
            });

            scene.add(controls.getObject());

            // Keyboard Listeners
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW':
                        moveForward = true;
                        break;
                    case 'ArrowLeft':
                    case 'KeyA':
                        moveLeft = true;
                        break;
                    case 'ArrowDown':
                    case 'KeyS':
                        moveBackward = true;
                        break;
                    case 'ArrowRight':
                    case 'KeyD':
                        moveRight = true;
                        break;
                    case 'KeyE':
                        if (isSitting) {
                            // Stand up
                            isSitting = false;
                            camera.position.y = 1.6; 
                            camera.position.z -= 0.8; // Step forward
                        } else {
                            // Check distance to sofa (approx 0, 0, 0.8)
                            if (camera.position.distanceTo(new THREE.Vector3(0, 0, 0.8)) < 3.5) {
                                isSitting = true;
                                moveForward = moveBackward = moveLeft = moveRight = false; // Stop moving
                                // Sit position (Head at typical height ~1.1m)
                                camera.position.set(0, 1.1, 0.8); 
                            }
                        }
                        break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW':
                        moveForward = false;
                        break;
                    case 'ArrowLeft':
                    case 'KeyA':
                        moveLeft = false;
                        break;
                    case 'ArrowDown':
                    case 'KeyS':
                        moveBackward = false;
                        break;
                    case 'ArrowRight':
                    case 'KeyD':
                        moveRight = false;
                        break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            buildRoom();
            setupLights();
            setupProjector();
            
            // Initial Scene State - Auto-start Off Mode
            triggerSceneVisuals('Off');
            // Try to init audio engine right away (might be blocked until click)
            initAudioEngine().catch(e => console.log("Audio init waiting for interaction"));

            window.addEventListener('resize', onWindowResize);
            document.getElementById('loading').style.display = 'none';
            animate();
        }

        // --- Texture Generation Helper ---
        function createProceduralTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            
            if (type === 'carpet') {
                // Dark grey base
                ctx.fillStyle = '#222222';
                ctx.fillRect(0, 0, 1024, 1024);
                
                // Add heavy noise for carpet fibers
                for (let i = 0; i < 200000; i++) {
                    const x = Math.random() * 1024;
                    const y = Math.random() * 1024;
                    const shade = Math.random();
                    ctx.fillStyle = shade > 0.5 ? 'rgba(60, 60, 60, 0.4)' : 'rgba(0, 0, 0, 0.4)';
                    ctx.fillRect(x, y, 2, 2);
                }
            } else if (type === 'wall') {
                // Cinema Wall - Dark Acoustic Fabric
                // Deep dark grey/black base
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0, 0, 1024, 1024);
                
                // Fabric texture pattern
                for (let i = 0; i < 200000; i++) {
                    const x = Math.random() * 1024;
                    const y = Math.random() * 1024;
                    // Crosshatch noise for fabric look
                    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(50, 50, 50, 0.15)' : 'rgba(0, 0, 0, 0.2)';
                    if (i % 2 === 0) {
                         ctx.fillRect(x, y, 1, 3); // Vertical thread
                    } else {
                         ctx.fillRect(x, y, 3, 1); // Horizontal thread
                    }
                }
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        // --- 3D Environment Construction ---
        function buildRoom() {
            // Floor - Carpet
            const floorGeo = new THREE.PlaneGeometry(ROOM_SIZE.w, ROOM_SIZE.d);
            const carpetTexture = createProceduralTexture('carpet');
            carpetTexture.repeat.set(4, 4); // Repeat texture
            
            materials.floor = new THREE.MeshStandardMaterial({ 
                map: carpetTexture, 
                color: 0x050505, // Preto
                roughness: 1.0,  // Fosco total
                metalness: 0.0 
            });
            
            const floor = new THREE.Mesh(floorGeo, materials.floor);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = 0.01; // Raise slightly to prevent Z-fighting with room floor
            floor.receiveShadow = true;
            scene.add(floor);

            // Walls - Modern Texture
            const wallGeo = new THREE.BoxGeometry(ROOM_SIZE.w, ROOM_SIZE.h, ROOM_SIZE.d);
            const wallTexture = createProceduralTexture('wall');
            wallTexture.repeat.set(3, 2); // Repeat texture
            
            materials.walls = new THREE.MeshStandardMaterial({ 
                map: wallTexture, 
                side: THREE.BackSide,
                color: 0x050505, // Preto
                roughness: 1.0,  // Fosco total
                metalness: 0.0
            });
            
            const roomBox = new THREE.Mesh(wallGeo, materials.walls);
            roomBox.position.y = ROOM_SIZE.h / 2;
            roomBox.receiveShadow = true;
            scene.add(roomBox);

            // --- MasterSound Logo on Left Wall ---
            const textureLoader = new THREE.TextureLoader();
            
            // Adding a timestamp to force browser to reload the image (avoid cache issues)
            const logoPath = 'assets/images/mastersound-logo.png?v=' + new Date().getTime();

            const logoTexture = textureLoader.load(
                logoPath,
                // onLoad callback
                function (texture) {
                    console.log('Logo loaded successfully');
                },
                // onProgress callback
                undefined,
                // onError callback
                function (err) {
                    console.error('ERROR LOADING LOGO:', err);
                    console.error('Attempted path:', logoPath);
                    // Fallback visual debug - Red square if logo fails
                    logoMesh.material.map = null;
                    logoMesh.material.color.setHex(0xff0000); 
                }
            ); 
            
            const logoGeo = new THREE.PlaneGeometry(6.0, 3.0); // Adjust aspect ratio as needed
            const logoMat = new THREE.MeshStandardMaterial({ 
                map: logoTexture,
                transparent: true, // Allows PNG transparency
                roughness: 0.8,
                metalness: 0.2
            });
            
            const logoMesh = new THREE.Mesh(logoGeo, logoMat);
            // Position on Left Wall (Negative X), slightly offset inwards (0.05) to avoid z-fighting
            logoMesh.position.set(-(ROOM_SIZE.w / 2) + 0.05, 2.2, 0); 
            logoMesh.rotation.y = Math.PI / 2; // Rotate to face center
            scene.add(logoMesh);

            // --- Modern Leather Sofa (Centers the User) ---
            const sofaGroup = new THREE.Group();
            
            // Leather Material (Black, shiny, slight bumps)
            const leatherMat = new THREE.MeshStandardMaterial({ 
                color: 0x050505, // Very dark grey/black
                roughness: 0.4,  // Smoother than fabric
                metalness: 0.1,  // Slight sheen
                // bumpMap: createLeatherNoise() // Advanced, but simple color is enough for MVP
            });

            // Sofa Base
            const baseGeo = new THREE.BoxGeometry(2.4, 0.3, 1.0);
            const base = new THREE.Mesh(baseGeo, leatherMat);
            base.position.y = 0.15;
            base.castShadow = true; base.receiveShadow = true;
            sofaGroup.add(base);

            // Seat Cushions (3 sections)
            const cushionGeo = new THREE.BoxGeometry(0.75, 0.15, 0.95);
            for(let i=-1; i<=1; i++) {
                const cushion = new THREE.Mesh(cushionGeo, leatherMat);
                cushion.position.set(i * 0.8, 0.375, 0.02);
                cushion.castShadow = true;
                sofaGroup.add(cushion);
            }

            // Backrest (Low, modern profile)
            const backGeo = new THREE.BoxGeometry(2.4, 0.5, 0.25);
            const back = new THREE.Mesh(backGeo, leatherMat);
            back.position.set(0, 0.55, 0.38);
            back.castShadow = true;
            sofaGroup.add(back);

            // Side Arms (Wide, blocky)
            const armGeo = new THREE.BoxGeometry(0.3, 0.6, 1.0);
            const armL = new THREE.Mesh(armGeo, leatherMat);
            armL.position.set(-1.35, 0.3, 0);
            armL.castShadow = true;
            sofaGroup.add(armL);
            
            const armR = new THREE.Mesh(armGeo, leatherMat);
            armR.position.set(1.35, 0.3, 0);
            armR.castShadow = true;
            sofaGroup.add(armR);

            // Mushroom logic removed
            /* 
            // 1. Red Mushroom - Removed
            const shroomGroup = new THREE.Group();
            ...
            */

            // Position Sofa
            sofaGroup.position.set(0, 0, 0.8);
            scene.add(sofaGroup);
            
            // --- Shelf with Figures (Back Right Corner) ---
            const shelfGroup = new THREE.Group();
            const shelfMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a }); // Dark wood/metal
            
            // Unit structure
            const shelfSideGeo = new THREE.BoxGeometry(0.05, 2.0, 0.4);
            const shelfSideL = new THREE.Mesh(shelfSideGeo, shelfMat);
            shelfSideL.position.x = -0.6;
            const shelfSideR = new THREE.Mesh(shelfSideGeo, shelfMat);
            shelfSideR.position.x = 0.6;
            shelfGroup.add(shelfSideL);
            shelfGroup.add(shelfSideR);
            
            // Shelves & Items
            const plankGeo = new THREE.BoxGeometry(1.25, 0.05, 0.4);
            for(let i=0; i<4; i++) {
                const y = -0.8 + (i * 0.55);
                const plank = new THREE.Mesh(plankGeo, shelfMat);
                plank.position.y = y;
                shelfGroup.add(plank);
                
                // Add decorations on shelves
                if (i === 2) { // Action Figures Shelf
                    const figGeo = new THREE.CapsuleGeometry(0.06, 0.15, 4, 8);
                    const colors = [0x00ff00, 0x0000ff, 0xff0000]; // Hero colors
                    for(let j=0; j<3; j++) {
                        const fig = new THREE.Mesh(figGeo, new THREE.MeshStandardMaterial({ color: colors[j] }));
                        fig.position.set(-0.3 + (j*0.3), y + 0.18, 0);
                        shelfGroup.add(fig);
                    }
                }
                if (i === 1) { // Books/Comics Shelf
                    const bookGeo = new THREE.BoxGeometry(0.05, 0.25, 0.2);
                    for(let k=0; k<8; k++) {
                        const book = new THREE.Mesh(bookGeo, new THREE.MeshStandardMaterial({ 
                            color: Math.random() * 0xffffff 
                        }));
                        book.position.set(-0.4 + (k*0.06), y + 0.15, 0);
                        // Random tilt
                        book.rotation.z = (Math.random() - 0.5) * 0.2;
                        shelfGroup.add(book);
                    }
                }
            }
            
            shelfGroup.position.set(4.7, 1.1, 2.5); // Right wall, parallel
            shelfGroup.rotation.y = -Math.PI / 2; // Reta, paralela a parede
            scene.add(shelfGroup);

            // --- Framed Posters on Right Wall ---
            // Expects images: assets/images/poster1.png, poster2.png, poster3.png
            const posterFiles = ['poster1.png', 'poster2.png', 'poster3.png'];
            const posterZPositions = [-2.5, -1.0, 0.5]; // Spaced along the wall

            posterFiles.forEach((filename, i) => {
                const zPos = posterZPositions[i];
                
                // 1. Black Frame
                const frameGeo = new THREE.BoxGeometry(0.1, 1.4, 1.0); // Thickness, Height, Width
                const frameMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6 });
                const frame = new THREE.Mesh(frameGeo, frameMat);
                frame.position.set(4.95, 2.2, zPos); // Right wall (X=5)
                scene.add(frame);
                
                // 2. Image Content
                const posterPath = `assets/images/${filename}?v=` + new Date().getTime();
                const tex = textureLoader.load(posterPath, undefined, undefined, (err) => {
                    // If missing, show a placeholder color
                    console.warn("Poster missing, showing placeholder for:", filename);
                });
                
                const imgGeo = new THREE.PlaneGeometry(0.9, 1.3);
                // Default placeholder color (different per poster)
                const fallbackColor = i === 0 ? 0xaa4444 : (i === 1 ? 0x44aa44 : 0x4444aa);
                
                const imgMat = new THREE.MeshStandardMaterial({ 
                    map: tex,
                    color: 0xffffff, // White to show texture colors correctly
                    roughness: 0.2
                });
                
                const img = new THREE.Mesh(imgGeo, imgMat);
                // Position slightly "out" from the frame face so it doesn't flicker
                img.position.set(4.89, 2.2, zPos); 
                img.rotation.y = -Math.PI / 2; // Face left (towards room center)
                scene.add(img);
            });

            // Speakers Visual Representation
            // Standard Speaker
            const speakerGeo = new THREE.BoxGeometry(0.3, 0.5, 0.3);
            const speakerMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

            // Subwoofer (Bigger, bulkier)
            const subGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
            const subMat = new THREE.MeshStandardMaterial({ color: 0x050505 });
            
            // Sweet spot for audio/viewing (Center of room, slightly above ear level)
            const centerPoint = new THREE.Vector3(0, 1.2, 0);

            SPEAKER_POSITIONS.forEach(pos => {
                const isSub = pos.label.includes("Subwoofer");
                // Clone material to allow individual emissive color changes
                const mat = isSub ? subMat.clone() : speakerMat.clone();
                const mesh = new THREE.Mesh(isSub ? subGeo : speakerGeo, mat);
                mesh.position.set(pos.x, pos.y, pos.z);
                
                // FACE THE CENTER
                mesh.lookAt(centerPoint);
                
                scene.add(mesh);
                speakerMeshes.push(mesh); // Store for Test Mode highlighting
                
                // Debug helper attached to the mesh so it rotates with it
                const grid = new THREE.GridHelper(isSub ? 0.8 : 0.5, 2);
                
                // Rotate grid 90 deg so it faces forward (relative to mesh +Z)
                grid.rotation.x = Math.PI / 2;
                
                // Position grid on the face of the speaker
                // Box depths are 0.3 (normal) and 0.6 (sub), so half is 0.15 and 0.3
                grid.position.z = isSub ? 0.31 : 0.16; 
                
                // Green for subs, white/grey for others
                grid.material.color.setHex(isSub ? 0x00ff00 : 0x888888); 
                
                // Add grid as child of mesh
                mesh.add(grid);
            });
        }

        function setupLights() {
            // Screen Ambient (Simulating light coming from screen)
            lights.screen = new THREE.RectAreaLight(0xffffff, 0, 6, 3);
            lights.screen.position.set(0, 2, -3.9);
            lights.screen.lookAt(0, 2, 0);
            scene.add(lights.screen);

            // Ceiling Spots (Dimmable)
            lights.spots = [];
            const spotPositions = [
                {x: -2, z: -2}, {x: 2, z: -2},
                {x: -2, z: 2}, {x: 2, z: 2}
            ];

            spotPositions.forEach(pos => {
                const spot = new THREE.SpotLight(0xffaa77, 0);
                spot.position.set(pos.x, ROOM_SIZE.h - 0.1, pos.z);
                spot.angle = Math.PI / 6;
                spot.penumbra = 0.5;
                spot.castShadow = true;
                scene.add(spot);
                lights.spots.push(spot);
            });

            // Ambient Perimeter Strips (Lighter Blue, subtle, full room contour)
            lights.wallStrips = [];
            const stripColor = 0xAADDFF; // Lighter/weaker blue
            const stripThickness = 0.2;
            
            // Left Strip (Along Z) - Uses Height for length
            const stripL = new THREE.RectAreaLight(stripColor, 0, stripThickness, ROOM_SIZE.d);
            stripL.position.set(-(ROOM_SIZE.w / 2) + 0.2, ROOM_SIZE.h - 0.05, 0);
            stripL.rotation.x = -Math.PI / 2; 
            scene.add(stripL);
            lights.wallStrips.push(stripL);

            // Right Strip (Along Z)
            const stripR = new THREE.RectAreaLight(stripColor, 0, stripThickness, ROOM_SIZE.d);
            stripR.position.set((ROOM_SIZE.w / 2) - 0.2, ROOM_SIZE.h - 0.05, 0);
            stripR.rotation.x = -Math.PI / 2; 
            scene.add(stripR);
            lights.wallStrips.push(stripR);

            // Front Strip (Along X) - Uses Width for length
            const stripF = new THREE.RectAreaLight(stripColor, 0, ROOM_SIZE.w, stripThickness);
            stripF.position.set(0, ROOM_SIZE.h - 0.05, -(ROOM_SIZE.d / 2) + 0.2);
            stripF.rotation.x = -Math.PI / 2;
            scene.add(stripF);
            lights.wallStrips.push(stripF);

            // Back Strip (Along X)
            const stripB = new THREE.RectAreaLight(stripColor, 0, ROOM_SIZE.w, stripThickness);
            stripB.position.set(0, ROOM_SIZE.h - 0.05, (ROOM_SIZE.d / 2) - 0.2);
            stripB.rotation.x = -Math.PI / 2;
            scene.add(stripB);
            lights.wallStrips.push(stripB);

            // Ambient base
            lights.ambient = new THREE.AmbientLight(0xffffff, 0.1);
            scene.add(lights.ambient);
        }

        function setupProjector() {
            const video = document.getElementById('video-source');
            const videoTexture = new THREE.VideoTexture(video);
            videoTexture.colorSpace = THREE.SRGBColorSpace;
            
            const geo = new THREE.PlaneGeometry(6, 3.4);
            // Use MeshBasicMaterial for the screen so it "glows" (isn't affected by shadows)
            materials.screen = new THREE.MeshBasicMaterial({ 
                color: 0x000000, 
                map: videoTexture 
            }); 
            
            const screen = new THREE.Mesh(geo, materials.screen);
            screen.position.set(0, 2, -3.95);
            scene.add(screen);
        }

        // --- Web Audio API Architecture ---
        async function initAudioEngine() {
            if (isAudioInitialized) return;

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioContext = new AudioContext();
            
            // Master Gain (Volume)
            masterGain = audioContext.createGain();
            
            // Create Reverb (Convolver)
            convolverNode = audioContext.createConvolver();
            // Generate a simple impulse response for reverb simulation
            const rate = audioContext.sampleRate;
            // Reduced decay from 2s to 0.4s to simulate acoustically treated cinema room
            const length = rate * 0.4; 
            const impulse = audioContext.createBuffer(2, length, rate);
            for (let channel = 0; channel < 2; channel++) {
                const channelData = impulse.getChannelData(channel);
                for (let i = 0; i < length; i++) {
                    // Sharper decay curve and lower amplitude (0.1) for tighter sound
                    channelData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 3) * 0.1;
                }
            }
            convolverNode.buffer = impulse;

            // Signal Chain: Sources -> Panner -> Convolver(Parallel) & Dry -> Master -> Dest
            convolverNode.connect(masterGain);
            masterGain.connect(audioContext.destination);

            isAudioInitialized = true;
            console.log("Audio Engine Initialized: HRTF Ready");
        }

        function startSpatialAudio() {
            const video = document.getElementById('video-source');
            video.muted = false; // Unmute
            video.play();
            
            // Clear previous manual gains
            manualGains = [];

            // Setup Audio Routing for Video (Pseudo-Upmixing Stereo to 5.1.2)
            // Ensure source node exists
            if (!video.sourceNode && audioContext) {
                video.sourceNode = audioContext.createMediaElementSource(video);
            }
            
            // Rebuild Graph Strategy: Disconnect source and rebuild 5.1 chain
            // This allows switching back and forth between Test Mode (Single Channel) and Cinema (5.1)
            if (video.sourceNode) {
                video.sourceNode.disconnect();
                
                // Split Stereo Source into Left (0) and Right (1)
                const splitter = audioContext.createChannelSplitter(2);
                video.sourceNode.connect(splitter);
                
                // Helper to create chain: Source -> AttenuationGain -> Panner -> Master/Reverb
                const createChannel = (inputNode, outputIndex, pos) => {
                    const attenuationGain = audioContext.createGain();
                    manualGains.push({ node: attenuationGain, pos: pos });
                    
                    const panner = createPanner(pos);
                    
                    // Connect Input -> Attenuation -> Panner
                    if (outputIndex !== null) {
                        inputNode.connect(attenuationGain, outputIndex);
                    } else {
                        inputNode.connect(attenuationGain);
                    }
                    attenuationGain.connect(panner);
                    
                    // Connect Panner -> Outputs
                    panner.connect(masterGain);
                    panner.connect(convolverNode);
                    
                    return { gain: attenuationGain, panner: panner };
                };

                // --- 1. Front Left (Index 0) ---
                createChannel(splitter, 0, SPEAKER_POSITIONS[0]);

                // --- 2. Front Right (Index 1) ---
                createChannel(splitter, 1, SPEAKER_POSITIONS[1]);

                // --- 3. Center (Index 2) ---
                // Special case for Center: Sum L+R
                const gainC = audioContext.createGain();
                gainC.gain.value = 0.6; 
                splitter.connect(gainC, 0); 
                splitter.connect(gainC, 1);
                
                // Route Center Sum -> Attenuation -> Panner
                const centerChain = createChannel(gainC, null, SPEAKER_POSITIONS[2]);
                // Boost Reverb for Center specifically (dialogue ambiance)
                const reverbGainC = audioContext.createGain();
                reverbGainC.gain.value = 0.2;
                centerChain.panner.disconnect(convolverNode); // Disconnect default
                centerChain.panner.connect(reverbGainC);
                reverbGainC.connect(convolverNode);

                // --- 4. Surround Left (Index 3) ---
                const delaySL = audioContext.createDelay();
                delaySL.delayTime.value = 0.015; 
                const gainSL = audioContext.createGain();
                gainSL.gain.value = 0.5; 
                splitter.connect(delaySL, 0);
                delaySL.connect(gainSL);
                createChannel(gainSL, null, SPEAKER_POSITIONS[3]);

                // --- 5. Surround Right (Index 4) ---
                const delaySR = audioContext.createDelay();
                delaySR.delayTime.value = 0.015;
                const gainSR = audioContext.createGain();
                gainSR.gain.value = 0.5;
                splitter.connect(delaySR, 1);
                delaySR.connect(gainSR);
                createChannel(gainSR, null, SPEAKER_POSITIONS[4]);

                // --- 6. SUBWOOFER (LFE Channel) (Index 5) ---
                const lfeFilter = audioContext.createBiquadFilter();
                lfeFilter.type = 'lowpass';
                lfeFilter.frequency.value = 80; // Changed to 80Hz for deeper, less muddy bass
                lfeFilter.Q.value = 0.7;
                const lfeGain = audioContext.createGain();
                lfeGain.gain.value = 2.5; // Boosted from 1.5 to 2.5 for more "felt" impact
                splitter.connect(lfeFilter, 0);
                splitter.connect(lfeFilter, 1);
                lfeFilter.connect(lfeGain);
                
                // Subwoofer Channel
                createChannel(lfeGain, null, SPEAKER_POSITIONS[5]);
            }
            
            // Clean up old oscillators if they exist
            soundSources.forEach(src => { try { src.osc.stop(); } catch(e){} });
            soundSources = [];
        }

        function createPanner(pos) {
            const panner = audioContext.createPanner();
            panner.panningModel = 'HRTF';
            panner.distanceModel = 'inverse'; // Native attenuation disabled effectively below
            panner.rolloffFactor = 0; // Disable native rolloff, handled by manualGains
            panner.positionX.value = pos.x;
            panner.positionY.value = pos.y;
            panner.positionZ.value = pos.z;
            return panner;
        }

        function createPinkNoise() {
            const bufferSize = 2 * audioContext.sampleRate; // 2 seconds buffer
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const output = buffer.getChannelData(0);
            let b0, b1, b2, b3, b4, b5, b6;
            b0 = b1 = b2 = b3 = b4 = b5 = b6 = 0.0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179;
                b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.86650 * b3 + white * 0.3104856;
                b4 = 0.55000 * b4 + white * 0.5329522;
                b5 = -0.7616 * b5 - white * 0.0168980;
                output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                output[i] *= 0.11; // (roughly) compensate for gain
                b6 = white * 0.115926;
            }
            return buffer;
        }

        async function runTestMode() {
            stopAudio(); // Clear everything
            manualGains = [];
            
            const pinkNoiseBuffer = createPinkNoise();
            let currentIndex = 0;
            let testPhase = 0; // 0 = Pink Noise, 1 = Music
            
            // Get media elements
            const video = document.getElementById('video-source');
            const music = document.getElementById('music-source');

            // Establish Music Source Node ONCE
            if (!music.sourceNode && audioContext) {
                music.sourceNode = audioContext.createMediaElementSource(music);
            }

            const playNext = () => {
                // Stop previous feedback if any
                speakerMeshes.forEach(m => {
                    m.material.emissive.setHex(0x000000); 
                });
                
                // Clear audio (Oscillators/Buffers)
                soundSources.forEach(src => {
                    try { src.stop(); } catch(e){} 
                    try { src.disconnect(); } catch(e){}
                });
                soundSources = [];
                manualGains = []; 

                // Music Logic:
                // 1. Always disconnect existing connection to speaker
                if (music.sourceNode) {
                    try { music.sourceNode.disconnect(); } catch(e){}
                }
                
                // Video Logic: Reset if potentially coming from Phase 2
                if (!video.paused || testPhase === 2) {
                     video.pause();
                     video.currentTime = 0;
                     // video.muted = true; // Don't mute here as we might need it for startSpatialAudio? Actually startSpatialAudio handles it.
                     if (video.sourceNode) {
                        try { video.sourceNode.disconnect(); } catch(e){}
                     }
                }

                // 2. Determine if we are staying in current phase or switching
                let nextPhase = testPhase;
                let transition = false;
                
                // If in Phase 2, transition immediately (single step phase)
                if (testPhase === 2) {
                     transition = true;
                     // Restore visual state for Test Mode
                     lights.spots.forEach(l => l.intensity = 10);
                     if(lights.ambient) lights.ambient.intensity = 0.1;
                     lights.screen.intensity = 1;
                     materials.screen.color.setHex(0x050505);
                }
                else if (currentIndex >= SPEAKER_POSITIONS.length) {
                    transition = true;
                    currentIndex = 0;
                }
                
                if (transition) {
                     // 0 -> 1 -> 2 -> 0 ...
                     if (testPhase === 2) nextPhase = 0;
                     else nextPhase = testPhase + 1;
                     
                     console.log(`Test Phase Switched from ${testPhase} to ${nextPhase}`);
                     testPhase = nextPhase;
                }

                // 3. If next up is Pink Noise (Phase 0), stop the music. 
                //    If next up is Music (Phase 1), let it continue (don't pause/reset)
                //    If next up is Cinema (Phase 2), stop music
                if (testPhase === 0 || testPhase === 2) {
                     music.pause();
                     music.currentTime = 0;
                }

                // --- EXECUTION ---
                if (testPhase === 2) {
                     // === PHASE 2: CINEMA FULL SYSTEM ===
                     console.log("Starting Phase 2: Cinema Mode 5.1 Test");
                     
                     // Visuals: Dim lights for Cinema
                     lights.spots.forEach(l => l.intensity = 0.0); 
                     if(lights.ambient) lights.ambient.intensity = 0.0;
                     lights.screen.intensity = 1.0; // Start low, dynamic update matches video
                     materials.screen.color.setHex(0xffffff); // Screen On
                     
                     // Highlight ALL speakers Green
                     speakerMeshes.forEach(m => m.material.emissive.setHex(0x00ff00));
                     
                     // Audio: Start Full 5.1 System
                     startSpatialAudio(); 
                     
                     // Duration: Play full movie then switch
                     // Remove any existing timer
                     if (testModeTimer) clearTimeout(testModeTimer);
                     
                     // Use onended event to trigger next phase
                     video.onended = () => {
                         video.onended = null; // Prevent multiple triggers
                         playNext();
                     };
                     return;
                }

                // === PHASE 0 & 1: SINGLE SPEAKER ===
                const pos = SPEAKER_POSITIONS[currentIndex];
                const mesh = speakerMeshes[currentIndex];
                
                console.log(`Testing Speaker (${testPhase === 0 ? 'Noise' : 'Music'}): ${pos.label}`);

                // Visual Feedback
                mesh.material.emissive.setHex(0x00ff00); // Green glow

                // Setup Chain: Source -> [Optional Filter] -> ManualGain -> Panner -> Master
                const manualGain = audioContext.createGain();
                manualGains.push({ node: manualGain, pos: pos }); // Enable distance attenuation per speaker
                
                let chainInput = null;
                
                // If Subwoofer, add Low Pass Filter to simulate real behavior in test mode
                if (pos.label.includes("Subwoofer")) {
                    const subFilter = audioContext.createBiquadFilter();
                    subFilter.type = 'lowpass';
                    subFilter.frequency.value = 80;
                    subFilter.Q.value = 1.0;
                    
                    // Boost filter output to compensate for lost energy
                    const subBoost = audioContext.createGain();
                    subBoost.gain.value = 2.0;
                    
                    subFilter.connect(subBoost);
                    subBoost.connect(manualGain);
                    chainInput = subFilter; // Source connects here
                } else {
                    chainInput = manualGain; // Source connects directly here
                }

                const panner = createPanner(pos);
                manualGain.connect(panner);
                panner.connect(masterGain);

                if (testPhase === 0) {
                    // --- PINK NOISE PHASE ---
                    const source = audioContext.createBufferSource();
                    source.buffer = pinkNoiseBuffer;
                    source.loop = true;
                    source.connect(chainInput);
                    source.start();
                    soundSources.push(source);
                } else {
                    // --- MUSIC PHASE (Dedicated Music Track) ---
                    // Connecting the ALREADY EXISTING source node
                    music.sourceNode.connect(chainInput);
                    
                    music.muted = false;
                    music.play().catch(e => console.error("Music Play Failed:", e));
                }

                currentIndex++;
                
                // Schedule next call
                testModeTimer = setTimeout(playNext, 5000); // 5 seconds per speaker
            };

            playNext();
        }

        function stopAudio() {
            if (testModeTimer) clearTimeout(testModeTimer);
            speakerMeshes.forEach(m => m.material.emissive.setHex(0x000000));
            
            const video = document.getElementById('video-source');
            video.pause();
            video.currentTime = 0; // Reset to start
            video.muted = true; // Mute to ensure no audio bleed

            const music = document.getElementById('music-source');
            music.pause();
            music.currentTime = 0;
            // Disconnect simply to be clean, but keep sourceNode alive
            if (music.sourceNode) {
                 try { music.sourceNode.disconnect(); } catch(e){}
            }
            
            // Stop synthesized ambience created in startSpatialAudio (if any remaining)
            soundSources.forEach(src => {
                try { src.osc.stop(audioContext.currentTime + 0.1); } catch(e){} 
                try { src.lfo.stop(audioContext.currentTime + 0.1); } catch(e){}
                // Determine if it is a buffer source (from test mode)
                try { src.stop(); } catch(e){}
            });
            soundSources = [];
            manualGains = [];
        }

        // --- Interaction & Orchestration ---

        // Exposed to global scope for HTML buttons
        window.triggerScene = async function(sceneName) {
            // Audio context requires user interaction to start
            if (!isAudioInitialized) await initAudioEngine();
            if (audioContext.state === 'suspended') await audioContext.resume();

            // Update UI state
            document.querySelectorAll('.keypad-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${sceneName.toLowerCase()}`).classList.add('active');

            triggerSceneVisuals(sceneName);
        };

        function triggerSceneVisuals(sceneName) {
            const transitionSpeed = 0.02; // Used in animation loop ideally, simpler here

            switch(sceneName) {
                case 'Welcome':
                    // Lights On, No Sound, No Screen
                    lights.screen.intensity = 0;
                    lights.spots.forEach(l => l.intensity = 20);
                    if(lights.wallStrips) lights.wallStrips.forEach(l => l.intensity = 1.0); // Blue Ambience Soft
                    if(lights.ambient) lights.ambient.intensity = 0.1;
                    materials.screen.color.setHex(0x000000);
                    stopAudio();
                    break;
                
                case 'Cinema':
                    // Lights Off (Dark Room), Screen takes over
                    lights.screen.intensity = 1.0; 
                    lights.spots.forEach(l => l.intensity = 0.0); // Spots OFF
                    if(lights.wallStrips) lights.wallStrips.forEach(l => l.intensity = 0.1); // Ultra Dim Blue
                    if(lights.ambient) lights.ambient.intensity = 0.0; // Ambient OFF
                    materials.screen.color.setHex(0xffffff); // Screen On
                    stopAudio(); // Ensure clean slate
                    startSpatialAudio(); 
                    break;

                case 'Test':
                     // Spotlight setup for maintenance
                     lights.screen.intensity = 1;
                     lights.spots.forEach(l => l.intensity = 10);
                     if(lights.wallStrips) lights.wallStrips.forEach(l => l.intensity = 1.0); // Blue Ambience Soft
                     if(lights.ambient) lights.ambient.intensity = 0.1;
                     materials.screen.color.setHex(0x050505); // Almost black, hide video content visually
                     runTestMode();
                     break;

                case 'Off':
                    lights.screen.intensity = 0;
                    lights.spots.forEach(l => l.intensity = 0);
                    if(lights.wallStrips) lights.wallStrips.forEach(l => l.intensity = 0); // All Off
                    if(lights.ambient) lights.ambient.intensity = 0.01; // Deep dark
                    materials.screen.color.setHex(0x000000);
                    stopAudio();
                    break;
            }
        }

        function updateAudioListener() {
            if (!audioContext || !camera) return;

            // Important: Sync Web Audio Listener with Three.js Camera
            const listener = audioContext.listener;
            
            // Position
            const p = camera.position;
            const f = new THREE.Vector3(0, 0, -1);
            f.applyQuaternion(camera.quaternion);
            const u = camera.up;

            if (listener.positionX) {
                // New standard API
                listener.positionX.value = p.x;
                listener.positionY.value = p.y;
                listener.positionZ.value = p.z;
                
                listener.forwardX.value = f.x;
                listener.forwardY.value = f.y;
                listener.forwardZ.value = f.z;
                
                listener.upX.value = u.x;
                listener.upY.value = u.y;
                listener.upZ.value = u.z;
            } else {
                // Deprecated (Legacy browser support)
                listener.setPosition(p.x, p.y, p.z);
                listener.setOrientation(f.x, f.y, f.z, u.x, u.y, u.z);
            }

            // Manual Distance Attenuation Logic
            if (manualGains.length > 0) {
                 manualGains.forEach(item => {
                     const speakerPos = new THREE.Vector3(item.pos.x, item.pos.y, item.pos.z);
                     const dist = p.distanceTo(speakerPos);
                     
                     // Custom Curve:
                     // < 2m = 100% volume
                     // > 10m = 0% volume
                     // Linear interpolation in betweeen
                     let vol = 1;
                     if (dist > 2) {
                        vol = 1 - ((dist - 2) / 8); 
                     }
                     
                     // Clamp
                     vol = Math.max(0, Math.min(1, vol)); 
                     
                     // Apply volume ramp smoothly
                     item.node.gain.setTargetAtTime(vol, audioContext.currentTime, 0.1);
                 });
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateScreenLight() {
            if (!lights.screen || !lightProbeCtx) return;
            const video = document.getElementById('video-source');
            
            // Only update if video is effectively playing
            if (video.paused || video.ended || video.readyState < 2) return;

            // Sample video frame (low res for speed)
            lightProbeCtx.drawImage(video, 0, 0, 4, 4);
            const frame = lightProbeCtx.getImageData(0, 0, 4, 4).data;
            
            let r=0, g=0, b=0;
            const pixelCount = frame.length / 4;
            
            for(let i=0; i<frame.length; i+=4) {
                r += frame[i];
                g += frame[i+1];
                b += frame[i+2];
            }
            
            // Average color
            r = r / pixelCount / 255;
            g = g / pixelCount / 255;
            b = b / pixelCount / 255;
            
            // Apply color to light (smooth interpolation)
            const targetColor = new THREE.Color(r, g, b);
            lights.screen.color.lerp(targetColor, 0.3); // Fast reaction
            
            // Calculate Luminance (rec709)
            const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
            
            // Map luminance to intensity (Dynamic Range)
            // Max intensity reduced to 6.0 as 15.0 was too bright
            const targetIntensity = lum * 6.0; 
            
            // Smooth intensity transition (lerp)
            lights.screen.intensity += (targetIntensity - lights.screen.intensity) * 0.2;
        }

        function animate() {
            requestAnimationFrame(animate); 
            
            updateScreenLight(); // Dynamic Ambilight Effect

            if (controls.isLocked === true) {
                const time = performance.now();
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize(); // Ensure consistent speed in all directions

                if (!isSitting) {
                    if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                    if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;
                }

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                prevTime = time;
            } else {
                // Prevent large delta jumps when pausing
                prevTime = performance.now();
            }

            updateAudioListener(); // Update spatial audio based on movement
            renderer.render(scene, camera);
        }

        init();
    </script>
